<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JariShare — Messages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B4EE6'/%3E%3Cpath d='M6 16 16 8l10 8M10 15v9h12v-9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    /* Apply saved theme before first paint */
    (function () {
      try {
        var t = localStorage.getItem("jariTheme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="lang.js"></script>
</head>
<body>
  <main class="page-shell">
    <div class="page-header">
      <div>
        <h1 class="page-title" data-i18n="msgs.title">Messages</h1>
        <p class="page-subtitle" data-i18n="msgs.subtitle">Rental conversations with renters, plus automatic alerts about your listings.</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="conversations" data-i18n="msgs.tabConv">Conversations</button>
      <button type="button" class="tab" data-tab="notifications" data-i18n="msgs.tabNotif">Notifications</button>
    </div>

    <div id="messages-list"></div>

    <p class="panels-note" data-i18n="msgs.footnote">Requests you receive will start a conversation here automatically.</p>
  </main>

  <script src="components.js"></script>
  <script>
    (function () {
      "use strict";
      var box = document.getElementById("messages-list");
      var activeTab = "conversations";

      function strip(text) {
        return String(text).replace(/^\s+/, "").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, "").trim();
      }

      function formatDate(iso) {
        var d = iso ? new Date(iso) : null;
        return d && !isNaN(d) ? d.toLocaleString() : "";
      }

      function msgRow() {
        return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
      }
      function bellRow() {
        return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
      }

      function emptyCard(titleKey, textKey, icon) {
        box.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">' + icon + "</div>" +
            '<h3 class="empty-title"></h3>' +
            '<p class="empty-text"></p>' +
          "</div>";
        box.querySelector(".empty-title").textContent = Jari.t(titleKey);
        box.querySelector(".empty-text").textContent = Jari.t(textKey);
      }

      function render() {
        if (activeTab === "conversations") {
          var msgs = JSON.parse(localStorage.getItem("jariMessages")) || [];
          if (!msgs.length) {
            emptyCard("msgs.emptyConvTitle", "msgs.emptyConvText", msgRow());
            return;
          }
          box.innerHTML =
            '<div class="activity-card" style="margin-top:14px;padding:6px 20px">' +
              msgs.slice().reverse().map(function () {
                return (
                  '<div class="msg-row">' +
                    '<span class="msg-avatar accent">' + msgRow() + "</span>" +
                    '<div class="msg-body">' +
                      '<p class="msg-name"></p>' +
                      '<p class="msg-text"></p>' +
                      '<p class="msg-time"></p>' +
                    "</div>" +
                  "</div>"
                );
              }).join("") +
            "</div>";
          Array.prototype.forEach.call(box.querySelectorAll(".msg-row"), function (row, i) {
            var m = msgs[msgs.length - 1 - i];
            row.querySelector(".msg-name").textContent = strip(m.from || m.name || "Neighbor");
            row.querySelector(".msg-text").textContent = strip(m.text || m.message || "");
            row.querySelector(".msg-time").textContent = formatDate(m.date);
          });
        } else {
          var notes = JSON.parse(localStorage.getItem("jariNotifications")) || [];
          if (!notes.length) {
            emptyCard("msgs.emptyNotifTitle", "msgs.emptyNotifText", bellRow());
            return;
          }
          box.innerHTML =
            '<div class="activity-card" style="margin-top:14px;padding:6px 20px">' +
              notes.map(function () {
                return (
                  '<div class="msg-row">' +
                    '<span class="msg-avatar accent">' + bellRow() + "</span>" +
                    '<div class="msg-body">' +
                      '<p class="msg-text"></p>' +
                      '<p class="msg-time"></p>' +
                    "</div>" +
                  "</div>"
                );
              }).join("") +
            "</div>";
          Array.prototype.forEach.call(box.querySelectorAll(".msg-row"), function (row, i) {
            var n = notes[i];
            row.querySelector(".msg-text").textContent = strip(n.title || "");
            row.querySelector(".msg-time").textContent = formatDate(n.date);
          });
        }
      }

      document.querySelector(".tabs").addEventListener("click", function (e) {
        var tab = e.target.closest(".tab");
        if (!tab) return;
        activeTab = tab.dataset.tab;
        Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
          t.classList.toggle("active", t === tab);
        });
        render();
      });

      document.addEventListener("jari:langchange", render);
      document.addEventListener("DOMContentLoaded", render);
    })();
  </script>
</body>
</html>
