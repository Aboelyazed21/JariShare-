<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JariShare — Post an Item</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B4EE6'/%3E%3Cpath d='M6 16 16 8l10 8M10 15v9h12v-9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    /* Apply saved theme before first paint */
    (function () {
      try {
        var t = localStorage.getItem("jariTheme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="lang.js"></script>
</head>
<body>
  <main class="page-shell">
    <a class="back-link" id="back-link" href="my-items.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span id="back-label" data-i18n="addItem.backMyItems">My Items</span>
    </a>

    <div class="page-header">
      <div>
        <h1 class="page-title" id="form-title">Post a new item</h1>
        <p class="page-subtitle" id="form-subtitle">Add a clear photo and the essentials — neighbors decide faster when they can see the item.</p>
      </div>
    </div>

    <form id="item-form" novalidate>
      <div class="form-card">
        <div class="field">
          <label class="label" for="item-photo" data-i18n="addItem.photo">Photo</label>
          <div class="upload-box" id="upload-box" role="button" tabindex="0">
            <input type="file" id="item-photo" accept="image/png,image/jpeg,image/jpg,image/webp" hidden>
            <span class="upload-icon" id="upload-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
            </span>
            <img id="upload-preview" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
            <div class="upload-text">
              <span class="upload-title" id="upload-title" data-i18n="addItem.uploadTitle">Upload a photo</span>
              <span class="upload-hint" id="upload-hint" data-i18n="addItem.uploadHint">PNG or JPG — click to browse, or drag an image here</span>
            </div>
          </div>
          <p class="hint" id="photo-meta"></p>
        </div>

        <div class="field">
          <label class="label" for="item-name"><span data-i18n="addItem.nameLabel">Item name</span> <span class="req">*</span></label>
          <input type="text" id="item-name" class="input" data-i18n-ph="addItem.namePh" placeholder="e.g. Cordless Drill, DSLR Camera…">
        </div>

        <div class="input-grid">
          <div class="field">
            <label class="label" for="item-category" data-i18n="addItem.category">Category</label>
            <select id="item-category" class="select">
              <option value="" data-i18n="addItem.selectPh">Select…</option>
              <option value="Electronics" data-i18n="cat.electronics">Electronics</option>
              <option value="Tools" data-i18n="cat.tools">Tools</option>
              <option value="Home &amp; Kitchen" data-i18n="cat.home">Home &amp; Kitchen</option>
              <option value="Outdoor" data-i18n="cat.outdoor">Outdoor</option>
              <option value="Other" data-i18n="cat.other">Other</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="item-sharing" data-i18n="addItem.sharing">Sharing type</label>
            <select id="item-sharing" class="select">
              <option value="rent" data-i18n="share.rent">Rent</option>
              <option value="borrow" data-i18n="share.borrow">Free borrow</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="label" for="item-price" data-i18n="addItem.price">Price per day</label>
          <div class="price-row">
            <input type="number" id="item-price" class="input" min="0" step="1" placeholder="0">
            <span class="price-unit" data-i18n="addItem.currency">EGP</span>
          </div>
          <p class="hint" id="price-hint" data-i18n="addItem.priceHint">Set 0 if you're offering it for free.</p>
        </div>

        <div class="field">
          <label class="label" for="item-desc" data-i18n="addItem.desc">Description</label>
          <textarea id="item-desc" class="input textarea" rows="4" data-i18n-ph="addItem.descPh" placeholder="Condition, accessories included, pickup spot, any usage rules…"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">Publish Item</button>
        </div>
      </div>
    </form>
  </main>

  <script src="components.js"></script>
  <script>
    (function () {
      "use strict";

      var editIndex = null;
      var params = new URLSearchParams(window.location.search);
      if (params.has("index")) {
        var n = parseInt(params.get("index"), 10);
        if (!isNaN(n) && n >= 0) editIndex = n;
      }

      var photoData = "";

      function catKey(cat) {
        var map = { "Electronics": "cat.electronics", "Tools": "cat.tools", "Home & Kitchen": "cat.home", "Outdoor": "cat.outdoor", "Other": "cat.other" };
        return map[cat] || "cat.other";
      }

      function showPhoto(dataUrl) {
        photoData = dataUrl;
        var img = document.getElementById("upload-preview");
        img.src = dataUrl;
        img.style.display = "block";
        document.getElementById("upload-icon").style.display = "none";
        document.getElementById("upload-title").textContent = Jari.t("addItem.previewName");
        document.getElementById("upload-hint").textContent = Jari.t("addItem.previewMeta");
      }

      function readFile(file) {
        if (!file || !/^image\//.test(file.type)) return;
        if (file.size > 3 * 1024 * 1024) {
          Jari.toast(Jari.t("toast.photoToo"), "error");
          return;
        }
        var reader = new FileReader();
        reader.onload = function () { showPhoto(reader.result); };
        reader.readAsDataURL(file);
      }

      var box = document.getElementById("upload-box");
      var picker = document.getElementById("item-photo");
      box.addEventListener("click", function () { picker.click(); });
      box.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); } });
      picker.addEventListener("change", function () { readFile(picker.files[0]); });

      ["dragover", "dragenter"].forEach(function (ev) {
        box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.add("dragging"); });
      });
      ["dragleave", "drop"].forEach(function (ev) {
        box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.remove("dragging"); });
      });
      box.addEventListener("drop", function (e) {
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        readFile(file);
      });

      /* Sync price hint with the sharing type / current price */
      function syncPriceHint() {
        var hintEl = document.getElementById("price-hint");
        var val = Number(document.getElementById("item-price").value);
        hintEl.textContent = val === 0 ? Jari.t("addItem.priceHintZero") : Jari.t("addItem.priceHint");
      }
      document.getElementById("item-price").addEventListener("input", syncPriceHint);

      /* Edit mode: prefill and rename the page */
      function applyEditMode() {
        var items = JSON.parse(localStorage.getItem("jariItems")) || [];
        var it = editIndex !== null ? items[editIndex] : null;

        if (editIndex !== null && (!it || it.owner !== localStorage.getItem("jariCurrentUser"))) {
          /* The listing does not belong to this user or doesn't exist */
          window.location.replace("my-items.html");
          return;
        }
        if (editIndex === null) return;

        document.title = "JariShare — Edit Item";
        var nameInput = document.getElementById("item-name");
        var catSel = document.getElementById("item-category");
        var priceInput = document.getElementById("item-price");
        var desc = document.getElementById("item-desc");
        nameInput.value = it.name || "";
        catSel.value = (it.category && catSel.querySelector('option[value="' + it.category.replace(/"/g, '\\"') + '"]')) ? it.category : "";
        priceInput.value = it.price || 0;
        desc.value = it.description || "";
        if (it.photo) showPhoto(it.photo);
        syncPriceHint();
      }

      function refreshHeader() {
        var editing = editIndex !== null;
        var title = document.getElementById("form-title");
        var subtitle = document.getElementById("form-subtitle");
        var btn = document.getElementById("submit-btn");
        title.textContent = Jari.t(editing ? "addItem.titleEdit" : "addItem.titleNew");
        subtitle.textContent = Jari.t(editing ? "addItem.subtitleEdit" : "addItem.subtitleNew");
        btn.textContent = Jari.t(editing ? "addItem.save" : "addItem.publish");
      }

      document.getElementById("item-form").addEventListener("submit", function (e) {
        e.preventDefault();

        var name = document.getElementById("item-name").value.trim();
        var category = document.getElementById("item-category").value;
        var sharing = document.getElementById("item-sharing").value;
        var price = document.getElementById("item-price").value === "" ? 0 : Number(document.getElementById("item-price").value);
        var description = document.getElementById("item-desc").value.trim();

        if (!name) return Jari.toast(Jari.t("toast.nameError"), "error");
        if (price < 0 || isNaN(price)) price = 0;
        if (sharing === "borrow") price = 0;

        var items = JSON.parse(localStorage.getItem("jariItems")) || [];
        var email = localStorage.getItem("jariCurrentUser") || "";

        if (editIndex !== null) {
          var it = items[editIndex];
          if (!it || it.owner !== email) {
            window.location.href = "my-items.html";
            return;
          }
            it.name = name;
            it.category = category || "Other";
            it.sharing = sharing;
            it.price = price;
            it.description = description;
            if (photoData) it.photo = photoData;
            items[editIndex] = it;
            localStorage.setItem("jariItems", JSON.stringify(items));
            var notes = JSON.parse(localStorage.getItem("jariNotifications")) || [];
            notes.unshift({ title: Jari.t("notif.updated", { name: name }), date: new Date().toISOString(), read: false });
            localStorage.setItem("jariNotifications", JSON.stringify(notes));
            Jari.flash(Jari.t("flash.changesSaved"));
            window.location.href = "my-items.html";
            return;
          }

        items.push({
          name: name,
          category: category || "Other",
          sharing: sharing,
          price: price,
          description: description,
          photo: photoData,
          status: "active",
          owner: email,
          addedAt: new Date().toISOString()
        });
        localStorage.setItem("jariItems", JSON.stringify(items));

        var notes2 = JSON.parse(localStorage.getItem("jariNotifications")) || [];
        notes2.unshift({ title: Jari.t("notif.added", { name: name }), date: new Date().toISOString(), read: false });
        localStorage.setItem("jariNotifications", JSON.stringify(notes2));

        Jari.flash(Jari.t("flash.published"));
        window.location.href = "my-items.html";
      });

      /* Header texts + grouping when language changes */
      document.addEventListener("jari:langchange", function () {
        refreshHeader();
        if (!photoData) {
          /* Keep placeholders/data-i18n live even after choosing nothing yet */
          document.getElementById("upload-title").textContent = Jari.t("addItem.uploadTitle");
          document.getElementById("upload-hint").textContent = Jari.t("addItem.uploadHint");
        } else {
          document.getElementById("upload-title").textContent = Jari.t("addItem.previewName");
          document.getElementById("upload-hint").textContent = Jari.t("addItem.previewMeta");
        }
        syncPriceHint();
      });
      document.addEventListener("DOMContentLoaded", function () {
        refreshHeader();
        applyEditMode();
        syncPriceHint();
        /* Re-run after other DOMContentLoaded side effects so edit mode wins */
        setTimeout(refreshHeader, 0);
      });
    })();
  </script>
</body>
</html>
