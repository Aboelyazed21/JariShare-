<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إحصائيات Codeforces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-image: url('lone-tree.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-gray-100/70 font-sans p-8">

  <div class="max-w-2xl mx-auto bg-white/80 p-6 rounded-xl shadow-md text-center relative">
    <div class="absolute top-4 left-4 animate-spin hidden" id="loader">
      <span class="text-xl">⏳</span>
    </div>

    <h1 class="text-3xl font-bold mb-4 text-blue-600">📊 إحصائيات حساب Codeforces</h1>
    <div id="result" class="text-gray-700 text-lg"></div>
    <canvas id="solvedChart" class="mt-8 hidden"></canvas>
  </div>

  <script>
    const defaultHandle = 'aboelyazeed1';

    async function fetchSolvedProblems() {
      const loader = document.getElementById('loader');
      const resultDiv = document.getElementById('result');
      const chartCanvas = document.getElementById('solvedChart');

      loader.classList.remove('hidden');
      resultDiv.innerHTML = '';

      try {
        const cached = localStorage.getItem('cf_stats');
        if (cached) {
          const parsed = JSON.parse(cached);
          const now = new Date().getTime();
          if (now - parsed.timestamp < 10 * 60 * 1000) {
            renderUI(parsed.data);
            loader.classList.add('hidden');
            return;
          }
        }

        const res = await fetch(`https://codeforces.com/api/user.status?handle=${defaultHandle}`);
        const data = await res.json();

        if (data.status !== 'OK') {
          resultDiv.innerHTML = '❌ حدث خطأ. تأكد من اسم المستخدم.';
          loader.classList.add('hidden');
          return;
        }

        const submissions = data.result;
        const solvedSet = new Set();
        const problemLevels = {};
        let lastSolvedTime = 0;

        submissions.forEach(sub => {
          if (sub.verdict === 'OK') {
            const id = `${sub.problem.contestId}-${sub.problem.index}`;
            solvedSet.add(id);
            const level = sub.problem.index[0];
            problemLevels[level] = (problemLevels[level] || 0) + 1;
            if (sub.creationTimeSeconds > lastSolvedTime) {
              lastSolvedTime = sub.creationTimeSeconds;
            }
          }
        });

        const solvedCount = solvedSet.size;
        const lastSolved = new Date(lastSolvedTime * 1000).toLocaleString('ar-EG');

        const userRes = await fetch(`https://codeforces.com/api/user.info?handles=${defaultHandle}`);
        const userData = await userRes.json();

        let lastSeen = 'غير متاح';
        let rank = 'غير معروف';
        let rating = 'غير متاح';
        let isOnline = false;

        if (userData.status === 'OK') {
          const user = userData.result[0];
          const lastOnlineSeconds = user.lastOnlineTimeSeconds;
          lastSeen = new Date(lastOnlineSeconds * 1000).toLocaleString('ar-EG');
          rank = user.rank || rank;
          rating = user.rating || rating;
          isOnline = (new Date().getTime() / 1000 - lastOnlineSeconds) < 300;
        }

        const resultData = {
          solvedCount,
          lastSeen,
          lastSolved,
          rank,
          rating,
          problemLevels,
          isOnline
        };

        localStorage.setItem('cf_stats', JSON.stringify({ timestamp: new Date().getTime(), data: resultData }));
        renderUI(resultData);
        loader.classList.add('hidden');

      } catch (error) {
        resultDiv.innerHTML = '⚠️ فشل في جلب البيانات. تحقق من الاتصال.';
        loader.classList.add('hidden');
      }
    }

    function renderUI(data) {
      const resultDiv = document.getElementById('result');
      const chartCanvas = document.getElementById('solvedChart');

      resultDiv.innerHTML = `
        <p>👤 اسم المستخدم: <span class="text-blue-600 font-semibold">${defaultHandle}</span></p>
        <p class="mt-2">✅ عدد المسائل المحلولة: <span class="text-green-600 font-bold">${data.solvedCount}</span></p>
        <p class="mt-2">🧩 آخر مسألة تم حلها: <span class="text-indigo-600 font-semibold">${data.lastSolved}</span></p>
        <p class="mt-2">🎖️ الرتبة: <span class="text-orange-600 font-medium">${data.rank}</span> | 🔢 التقييم: <span class="text-pink-600">${data.rating}</span></p>
        <p class="mt-2">🕒 آخر نشاط: <span class="${data.isOnline ? 'text-green-600' : 'text-purple-600'} font-medium">${data.lastSeen} ${data.isOnline ? '(نشط الآن ✅)' : ''}</span></p>
        <p class="mt-4 text-sm text-gray-500">📡 تم التحديث تلقائيًا، كل 10 دقائق.</p>
      `;

      chartCanvas.classList.remove('hidden');
      const ctx = chartCanvas.getContext('2d');
      const chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(data.problemLevels),
          datasets: [{
            label: 'عدد المسائل حسب المستوى',
            data: Object.values(data.problemLevels),
            backgroundColor: 'rgba(59, 130, 246, 0.5)',
            borderColor: 'rgba(59, 130, 246, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    fetchSolvedProblems();
    setInterval(fetchSolvedProblems, 600000);
  </script>

</body>
</html>
