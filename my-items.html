<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JariShare — My Items</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <script>
    /* Apply saved theme before first paint */
    (function () {
      try {
        var t = localStorage.getItem("jariTheme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="lang.js"></script>
</head>
<body>
  <main class="page-shell">
    <a class="back-link" href="dashboard.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span data-i18n="items.backDash">Dashboard</span>
    </a>

    <div class="page-header">
      <div>
        <h1 class="page-title" data-i18n="items.title">My Items</h1>
        <p class="page-subtitle" data-i18n="items.subtitle">Everything you've listed for your neighbors — switch status, edit details or remove a listing at any time.</p>
      </div>
      <a class="btn btn-primary" href="add-item.html" data-i18n="nav.postItem">Post an Item</a>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-filter="all" data-i18n="items.tabAll">All</button>
      <button type="button" class="tab" data-filter="active" data-i18n="status.active">Active</button>
      <button type="button" class="tab" data-filter="pending" data-i18n="status.pending">Pending</button>
      <button type="button" class="tab" data-filter="unavailable" data-i18n="status.unavailable">Unavailable</button>
    </div>

    <div id="items-list" class="items-list"></div>
  </main>

  <script src="components.js"></script>
  <script>
    (function () {
      "use strict";
      var listEl = document.getElementById("items-list");
      var activeFilter = "all";

      function catKey(cat) {
        var map = { "Electronics": "cat.electronics", "Tools": "cat.tools", "Home & Kitchen": "cat.home", "Outdoor": "cat.outdoor", "Other": "cat.other" };
        return map[cat] || "cat.other";
      }

      function render() {
        var email = localStorage.getItem("jariCurrentUser") || "";
        var items = JSON.parse(localStorage.getItem("jariItems")) || [];
        var mine = items.filter(function (it) { return it.owner === email; });

        if (activeFilter !== "all") {
          mine = mine.filter(function (it) { return (it.status || "active") === activeFilter; });
        }

        if (!mine.length) {
          var isFiltered = activeFilter !== "all";
          listEl.innerHTML =
            '<div class="empty-state">' +
              '<div class="empty-icon">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 7 4h10l4 3.5M3 7.5V19a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7.5M3 7.5h18M9 11h6"/></svg>' +
              "</div>" +
              '<h3 class="empty-title"></h3>' +
              '<p class="empty-text"></p>' +
              (isFiltered
                ? '<div class="empty-action"><a class="btn btn-ghost btn-sm" href="add-item.html" data-i18n="nav.postItem">Post an Item</a></div>'
                : "") +
            "</div>";
          listEl.querySelector(".empty-title").textContent = Jari.t(isFiltered ? "items.emptyFilterTitle" : "items.emptyAllTitle", isFiltered ? { name: Jari.t("status." + activeFilter) } : null);
          listEl.querySelector(".empty-text").textContent = Jari.t(isFiltered ? "items.emptyFilterText" : "items.emptyAllText");
          return;
        }

        /* newest first */
        mine = mine.slice().reverse();

        listEl.innerHTML = mine.map(function (it) {
          var globalIdx = items.indexOf(it);
          var price = Number(it.price) > 0
            ? "<strong>" + Number(it.price).toLocaleString("en-US") + "</strong> <span>" + Jari.t("items.perDay") + "</span>"
            : "<strong>" + Jari.t("cat.freeBorrow") + "</strong>";
          var photo = it.photo ? it.photo : "images/tools.jpg.jpeg";
          return (
            '<article class="item-card" data-idx="' + globalIdx + '">' +
              '<img class="item-thumb" src="' + photo + '" alt="">' +
              '<div class="item-info">' +
                '<h3 class="item-name"></h3>' +
                '<span class="item-cat"></span>' +
                '<span class="item-price">' + price + "</span>" +
              "</div>" +
              '<div class="item-actions">' +
                '<select class="status-select st-' + (it.status || "active") + '" data-act="status" aria-label="' + Jari.t("items.a11yStatus") + '">' +
                  ["active", "pending", "unavailable"].map(function (s) {
                    return '<option value="' + s + '"' + (s === (it.status || "active") ? " selected" : "") + ">" + Jari.t("status." + s) + "</option>";
                  }).join("") +
                "</select>" +
                '<button type="button" class="icon-btn" data-act="edit" data-i18n-aria="items.a11yEdit" title="' + Jari.t("items.a11yEdit") + '">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>' +
                "</button>" +
                '<button type="button" class="icon-btn danger" data-act="delete" data-i18n-aria="items.a11yDelete" title="' + Jari.t("items.a11yDelete") + '">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14Z"/></svg>' +
                "</button>" +
              "</div>" +
            "</article>"
          );
        }).join("");

        /* Fill text nodes (avoids HTML injection from stored names) */
        Array.prototype.forEach.call(listEl.querySelectorAll(".item-card"), function (card) {
          var it = items[Number(card.dataset.idx)];
          card.querySelector(".item-name").textContent = it.name;
          card.querySelector(".item-cat").textContent = Jari.t(catKey(it.category));
          if (it.description) {
            var d = document.createElement("p");
            d.className = "item-cat";
            d.style.fontSize = "12.5px";
            d.style.marginTop = "2px";
            d.textContent = it.description;
            card.querySelector(".item-price").after(d);
          }
        });
      }

      listEl.addEventListener("change", function (e) {
        var sel = e.target.closest("select[data-act='status']");
        if (!sel) return;
        var card = sel.closest(".item-card");
        var idx = Number(card.dataset.idx);

        var items = JSON.parse(localStorage.getItem("jariItems")) || [];
        var it = items[idx];
        var old = it.status || "active";
        var next = sel.value;
        it.status = next;
        items[idx] = it;
        localStorage.setItem("jariItems", JSON.stringify(items));

        var notes = JSON.parse(localStorage.getItem("jariNotifications")) || [];
        notes.unshift({ title: Jari.t("notif.status", { name: it.name, status: Jari.t("status." + next) }), date: new Date().toISOString(), read: false });
        localStorage.setItem("jariNotifications", JSON.stringify(notes));

        sel.className = "status-select st-" + next;
        Jari.toast(Jari.t("toast.statusUpdated", { name: Jari.t("status." + next) }), "success");

        if (activeFilter !== "all" && activeFilter !== next) render();
      });

      listEl.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-act='edit'], [data-act='delete']");
        if (!btn) return;
        var card = btn.closest(".item-card");
        var idx = Number(card.dataset.idx);
        var items = JSON.parse(localStorage.getItem("jariItems")) || [];

        if (btn.dataset.act === "edit") {
          window.location.href = "add-item.html?index=" + idx;
          return;
        }

        var name = items[idx] ? items[idx].name : "";
        Jari.confirm(Jari.t("confirm.deleteTitle", { name: name }), Jari.t("confirm.deleteText"), Jari.t("confirm.delete"))
          .then(function (ok) {
            if (!ok) { render(); return; }
            items.splice(idx, 1);
            localStorage.setItem("jariItems", JSON.stringify(items));
            var notes = JSON.parse(localStorage.getItem("jariNotifications")) || [];
            notes.unshift({ title: Jari.t("notif.deleted", { name: name }), date: new Date().toISOString(), read: false });
            localStorage.setItem("jariNotifications", JSON.stringify(notes));
            Jari.toast(Jari.t("toast.deleted"), "success");
            render();
          });
      });

      document.querySelector(".tabs").addEventListener("click", function (e) {
        var tab = e.target.closest(".tab");
        if (!tab) return;
        activeFilter = tab.dataset.filter;
        Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
          t.classList.toggle("active", t === tab);
        });
        render();
      });

      document.addEventListener("jari:langchange", render);
      document.addEventListener("DOMContentLoaded", render);
    })();
  </script>
</body>
</html>
