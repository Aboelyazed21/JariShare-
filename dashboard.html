<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JariShare — Dashboard</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <script>
    /* Apply saved theme before first paint */
    (function () {
      try {
        var t = localStorage.getItem("jariTheme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="lang.js"></script>
</head>
<body>
  <div class="dash">

    <aside class="sidebar">
      <div class="side-user">
        <span class="side-avatar" id="side-avatar">A</span>
        <div>
          <div class="side-name" id="side-name">Ahmed Ali</div>
          <div class="side-email" id="side-email">ahmed@test.com</div>
        </div>
      </div>

      <nav class="side-menu">
        <a class="menu-item active" href="dashboard.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a class="menu-item" href="my-items.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 7 4h10l4 3.5M3 7.5V19a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7.5M3 7.5h18M9 11h6"/></svg>
          <span data-i18n="nav.myItems">My Items</span>
        </a>
        <a class="menu-item" href="add-item.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          <span data-i18n="nav.postItem">Post an Item</span>
        </a>
        <a class="menu-item" href="messages.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span data-i18n="nav.messages">Messages</span>
        </a>
      </nav>

      <button type="button" class="side-logout" id="side-logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
        <span data-i18n="nav.signOut">Sign Out</span>
      </button>
    </aside>

    <main class="dash-main">
      <h1 class="dash-title" id="dash-welcome">Welcome back, Ahmed</h1>
      <p class="dash-subtitle" data-i18n="dash.subtitle">Here's what's happening with your listings and requests today.</p>

      <div class="stats-grid">
        <a class="stat-card" href="my-items.html">
          <div class="stat-head">
            <span class="stat-label" data-i18n="dash.statItems">My Items</span>
            <span class="stat-icon primary">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 7 4h10l4 3.5M3 7.5V19a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7.5M3 7.5h18M9 11h6"/></svg>
            </span>
          </div>
          <div class="stat-value" id="stat-items">0</div>
          <div class="stat-note" id="stat-items-note">No listings yet</div>
        </a>

        <a class="stat-card ok" href="my-items.html">
          <div class="stat-head">
            <span class="stat-label" data-i18n="dash.statActive">Active Rentals</span>
            <span class="stat-icon success">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </div>
          <div class="stat-value" id="stat-active">0</div>
          <div class="stat-note" data-i18n="dash.noteActive">Listed and available</div>
        </a>

        <a class="stat-card warn" href="messages.html">
          <div class="stat-head">
            <span class="stat-label" data-i18n="dash.statPending">Pending Requests</span>
            <span class="stat-icon warning">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
          </div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-note" data-i18n="dash.notePending">Waiting to be approved</div>
        </a>
      </div>

      <div class="activity-card">
        <div class="activity-head">
          <h2 class="activity-title" data-i18n="dash.activity">Recent Activity</h2>
          <a class="activity-link" href="messages.html" data-i18n="dash.viewAll">View all</a>
        </div>
        <div id="activity-list"></div>
      </div>
    </main>
  </div>

  <script src="components.js"></script>
  <script>
    (function () {
      "use strict";

      function currentUser() {
        var email = localStorage.getItem("jariCurrentUser") || "";
        var users = JSON.parse(localStorage.getItem("jariUsers")) || [];
        for (var i = 0; i < users.length; i++) {
          if (users[i].email === email) return users[i];
        }
        return null;
      }

      function first(n) {
        var clean = String(n || "").replace(/\s+/g, " ").trim();
        return clean ? clean.split(" ")[0] : "";
      }

      function initials(n) {
        var p = String(n || "").replace(/\s+/g, " ").trim().split(" ");
        var s = (p[0]?.charAt(0) || "") + (p[1]?.charAt(0) || "");
        return (s || "J").toUpperCase();
      }

      function renderActivity() {
        var notes = JSON.parse(localStorage.getItem("jariNotifications")) || [];
        var box = document.getElementById("activity-list");

        if (!notes.length) {
          box.innerHTML =
            '<div class="empty-state">' +
              '<div class="empty-icon">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>' +
              "</div>" +
              '<h3 class="empty-title"></h3>' +
              '<p class="empty-text"></p>' +
              '<div class="empty-action"><a class="btn btn-ghost btn-sm" href="add-item.html" data-i18n="nav.postItem">Post an Item</a></div>' +
            "</div>";
          box.querySelector(".empty-title").textContent = Jari.t("dash.activityEmpty");
          box.querySelector(".empty-text").textContent = Jari.t("dash.subtitle");
          return;
        }

        box.innerHTML = notes.slice(0, 6).map(function (n) {
          return (
            '<div class="activity-row">' +
              '<span class="stat-icon primary" style="width:30px;height:30px;border-radius:9px;flex:none">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>' +
              "</span>" +
              '<div style="flex:1;min-width:0">' +
                '<p class="side-email" style="max-width:none;color:var(--text-700)"></p>' +
                '<p style="font-size:11.5px;color:var(--text-400)"></p>' +
              "</div>" +
            "</div>"
          );
        }).join("");

        Array.prototype.forEach.call(box.querySelectorAll(".activity-row"), function (row, i) {
          var note = notes[i];
          row.querySelector(".side-email").textContent = String(note.title || "").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, "").trim();
          var d = note.date ? new Date(note.date) : null;
          row.lastElementChild.lastElementChild.textContent = d && !isNaN(d) ? d.toLocaleString() : "";
        });
      }

      function render() {
        var user = currentUser();

        /* Sidebar identity */
        var name = user ? user.name : localStorage.getItem("jariCurrentUser") || "";
        document.getElementById("side-name").textContent = name || Jari.t("dash.member");
        document.getElementById("side-email").textContent = user ? user.email : "";
        document.getElementById("side-avatar").textContent = initials(name);
        document.getElementById("dash-welcome").textContent = Jari.t("dash.welcome", { name: first(name) || Jari.t("dash.member") });

        /* Stats */
        var email = localStorage.getItem("jariCurrentUser");
        var items = (JSON.parse(localStorage.getItem("jariItems")) || []).filter(function (it) { return it.owner === email; });
        var active = items.filter(function (it) { return (it.status || "active") === "active"; }).length;
        var pending = items.filter(function (it) { return it.status === "pending"; }).length;

        document.getElementById("stat-items").textContent = items.length;
        document.getElementById("stat-active").textContent = active;
        document.getElementById("stat-pending").textContent = pending;
        document.getElementById("stat-items-note").textContent = items.length
          ? Jari.t("dash.noteItems", { name: items.length })
          : Jari.t("dash.noteItemsZero");

        renderActivity();
      }

      /* Log out from the sidebar */
      document.getElementById("side-logout").addEventListener("click", function () {
        Jari.confirm(Jari.t("confirm.signOutTitle"), Jari.t("confirm.signOutText"), Jari.t("confirm.signOut"))
          .then(function (ok) {
            if (!ok) return;
            localStorage.removeItem("jariCurrentUser");
            Jari.flash(Jari.t("notice.signedOut"));
            window.location.href = "login.html";
          });
      });

      document.addEventListener("jari:langchange", render);
      document.addEventListener("DOMContentLoaded", render);
    })();
  </script>
</body>
</html>
